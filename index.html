<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IMPACTUM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--ink:#10243a;--sea:#0f7a6d;--sun:#f2b632;--paper:#f4f7f6;--card:#fff;--line:#d9e2df;--mute:#5d6f7c}
*{box-sizing:border-box;margin:0}
body{font-family:Georgia,'Times New Roman',serif;background:var(--paper);color:var(--ink);padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));max-width:520px;margin:auto;line-height:1.5}
h1{font-size:34px;letter-spacing:.04em}
h2{font-size:21px;margin-bottom:6px}
.sub{color:var(--mute);font-size:15px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
button,input,select{font:inherit}
.big{width:100%;padding:18px;border:0;border-radius:14px;background:var(--sea);color:#fff;font-size:20px;font-weight:700;cursor:pointer}
.big:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{padding:12px 16px;border:0;border-radius:10px;background:var(--ink);color:#fff;cursor:pointer;margin-top:12px}
.opt{display:block;width:100%;text-align:left;padding:13px;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-size:16px}
.opt.on{border-color:var(--sea);background:#e3f3f0;font-weight:700}
input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin-top:8px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--sea)}
.row{display:flex;justify-content:space-between;font-size:15px;margin-top:10px}
.tag{display:inline-block;font-size:13px;background:#fdf1d0;border-radius:8px;padding:2px 8px;margin-top:6px}
.hide{display:none}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .8s}}
</style>
</head>
<body>
<h1>IMPACTUM</h1>
<p class="sub" id="hello">Bir inson. Bir yaxshilik. Bir dunyo.</p>

<section id="home">
  <button class="big" id="start">I WANT TO HELP</button>
  <div class="card" style="margin-top:16px" id="mission"></div>
</section>

<section id="quiz" class="hide">
  <div class="card" id="q"></div>
</section>

<section id="result" class="hide">
  <h2>Siz uchun loyihalar topildi</h2>
  <p class="sub" id="rsub"></p>
  <div id="plist"></div>
  <button class="btn" id="back">Bosh sahifaga</button>
</section>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
if (u && u.first_name) document.getElementById('hello').textContent = 'Salom, ' + u.first_name + '! Bir inson. Bir yaxshilik. Bir dunyo.';

const $ = id => document.getElementById(id);
const show = id => ['home','quiz','result'].forEach(s => $(s).classList.toggle('hide', s !== id));

// Mission (namuna ma'lumot — keyin bazadan keladi)
const mission = {title:'MISSION #001: 10 000 ta daraxt', goal:10000,
  data:[['O‘zbekiston',1240],['AQSh',1830],['Turkiya',870],['Koreya',620],['Germaniya',510]]};
const total = mission.data.reduce((a,b)=>a+b[1],0);
$('mission').innerHTML = '<h2>'+mission.title+'</h2>' +
  '<div class="row"><b>Global: '+total.toLocaleString()+' / '+mission.goal.toLocaleString()+'</b></div>' +
  '<div class="bar"><i style="width:'+(total/mission.goal*100)+'%"></i></div>' +
  mission.data.map(d=>'<div class="row"><span>'+d[0]+'</span><span>'+d[1].toLocaleString()+'</span></div>').join('');

// Savollar
const skills = ['Grafik dizayn','O‘qitish','Dasturlash','Tadbir tashkil qilish'];
const hours = ['1–3 soat','4–6 soat','7+ soat'];
let ans = {city:'', skill:'', hours:''};
function ask(text, opts, key, next){
  $('q').innerHTML = '<h2>'+text+'</h2>' + opts.map(o=>'<button class="opt">'+o+'</button>').join('');
  [...$('q').querySelectorAll('.opt')].forEach(b => b.onclick = () => { ans[key] = b.textContent; next(); });
}
function askCity(){
  $('q').innerHTML = '<h2>Qayerdasiz?</h2><input id="city" placeholder="Masalan: Toshkent" aria-label="Shahar"><button class="btn" id="ok">Davom etish</button>';
  $('ok').onclick = () => { ans.city = $('city').value.trim() || 'Noma’lum'; askSkill(); };
}
const askSkill = () => ask('Nimani bilasiz?', skills, 'skill', askHours);
const askHours = () => ask('Haftasiga qancha vaqt ajrata olasiz?', hours, 'hours', finish);

// Loyihalar (namuna)
const projects = [
  ['Mahalla NGO uchun logo','O‘zbekiston','Grafik dizayn'],
  ['Jamoat uchun poster','Keniya','Grafik dizayn'],
  ['Maktab uchun taqdimot','Filippin','Grafik dizayn'],
  ['Bolalarga ingliz tili darsi','Turkiya','O‘qitish'],
  ['Onlayn matematika to‘garagi','Hindiston','O‘qitish'],
  ['Volontyorlar uchun sayt','Germaniya','Dasturlash'],
  ['Xayriya bozori','O‘zbekiston','Tadbir tashkil qilish']
];
function finish(){
  const list = projects.filter(p => p[2] === ans.skill);
  $('rsub').textContent = ans.city + ' • ' + ans.skill + ' • haftasiga ' + ans.hours;
  $('plist').innerHTML = list.map(p => '<div class="card"><b>'+p[0]+'</b><br><span class="tag">'+p[1]+'</span></div>').join('') || '<div class="card">Hozircha loyiha yo‘q.</div>';
  show('result');
}
$('start').onclick = () => { show('quiz'); askCity(); };
$('back').onclick = () => show('home');
</script>
</body>
</html>
